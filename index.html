<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハングル タイピング練習</title><style>body{font-family:-apple-system,sans-serif;background:#f5f6f8;margin:0;color:#111}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px #0001}button{font-size:16px;border:0;border-radius:11px;padding:11px 16px;margin:3px;background:#e9edf3}.primary{background:#0d47a1;color:#fff;font-weight:700}#kr{font-size:34px;font-weight:800;text-align:center;margin:24px 0 4px}#jp,#status{text-align:center;margin:8px}input{box-sizing:border-box;width:100%;font-size:28px;text-align:center;padding:14px;border:3px solid #ccd2da;border-radius:13px;margin:12px 0}.ok{background:#effaf0!important}.bad{background:#fff1f1!important}.hint{text-align:center;color:#666;font-size:14px}.guide{text-align:center;font-weight:800;color:#d32f2f;margin:10px 0}.kbd{margin-top:18px;padding:12px;background:#fff;border-radius:18px;box-shadow:0 3px 15px #0001;overflow-x:auto}.kbdtitle{text-align:center;font-weight:800;margin-bottom:8px}.krow{display:flex;gap:5px;justify-content:center;margin:5px 0}.key{position:relative;min-width:46px;height:46px;border:2px solid #d4d8df;border-radius:8px;background:#f0f0f0;text-align:center;font-weight:800;transition:.12s}.key .eng{position:absolute;left:5px;top:2px;font-size:10px;color:#666}.key .kor{font-size:18px;line-height:46px}.key.home{background:#0d47a1;border-color:#0d47a1;color:#fff}.key.home .eng{color:#bbdefb}.key.home:after{content:"•";position:absolute;bottom:-2px;left:0;right:0;font-size:18px;color:#fff}.key.nextkey{background:#e53935!important;border-color:#b71c1c!important;color:#fff!important;transform:translateY(-2px);box-shadow:0 3px 8px #e5393566}.key.nextkey .eng{color:#fff!important}.space{width:220px}.shift{width:70px}.key.shift .kor,.key.space .kor{font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:stretch}.coach{position:relative;background:#15131b;border-radius:18px;overflow:hidden;min-height:360px}.coach img{width:100%;height:100%;object-fit:cover;object-position:left center}.coach.react{animation:coachPop .42s ease}.bubble{position:absolute;left:10px;right:10px;bottom:12px;background:#111d;color:#fff;border:1px solid #d6b27a;border-radius:12px;padding:10px;text-align:center;font-weight:700;opacity:0;transform:translateY(8px);transition:.18s}.bubble.show{opacity:1;transform:none}@keyframes coachPop{50%{transform:scale(1.035);filter:brightness(1.25)}}@media(max-width:820px){.key{min-width:39px;height:42px}.key .kor{line-height:42px}.kbd{padding:8px}.krow{gap:3px}}@media(max-width:650px){.layout{grid-template-columns:1fr}.coach{min-height:210px}.coach img{height:210px;object-position:center 27%}}</style></head><body><main><h2>🇰🇷 ハングル タイピング練習</h2><div class="layout"><div class="coach" id="coach"><img src="%E9%9F%93%E5%9B%BD%E8%AA%9E%E3%82%BF%E3%82%A4%E3%83%94%E3%83%B3%E3%82%B0%E3%82%B2%E3%83%BC%E3%83%A0%E3%81%A8%E7%9F%A5%E7%9A%84%E3%81%AA%E5%A5%B3%E6%80%A7.png" alt="オリジナル韓国語教師キャラクター"><div class="bubble" id="bubble">PERFECT!</div></div><div class="card"><button class="primary" id="start">スタート</button><button id="skip">スキップ</button><button id="speak">🔊 音声</button><span id="count"></span><div id="kr">「スタート」を押して開始</div><div id="jp"></div><div id="status"></div><input id="answer" lang="ko" autocomplete="off" placeholder="ここに韓国語を入力" disabled><div class="hint">最大6文字までのハングルから出題します。iPadでは韓国語キーボードで入力してください。</div><div id="guide" class="guide"></div></div></div><div class="kbd"><div class="kbdtitle">キーボード配置ガイド（2ボル式）</div><div id="keyboard"></div></div></main><script>
const U="https://docs.google.com/spreadsheets/d/e/2PACX-1vSDYYTuS1gyeWWXL2DhGnpenN6-MGjlYauitFx6Ia4K_sRSVeOxJoJOkc9R6SsHX9FXJSCvs2ax5tre/pub?output=csv",F=[["안녕하세요","こんにちは"],["감사합니다","ありがとうございます"],["한국어","韓国語"],["공부","勉強"],["친구","友達"],["사랑해요","愛しています"],["학교","学校"],["음악","音楽"],["커피","コーヒー"]];let w=F,c,n=0,s=0,t=10,a=false,last=null,$=x=>document.getElementById(x);
const ROWS=[[["Q","ㅂ"],["W","ㅈ"],["E","ㄷ"],["R","ㄱ"],["T","ㅅ"],["Y","ㅛ"],["U","ㅕ"],["I","ㅑ"],["O","ㅐ"],["P","ㅔ"]],[["A","ㅁ"],["S","ㄴ"],["D","ㅇ"],["F","ㄹ"],["G","ㅎ"],["H","ㅗ"],["J","ㅓ"],["K","ㅏ"],["L","ㅣ"]],[["Z","ㅋ"],["X","ㅌ"],["C","ㅊ"],["V","ㅍ"],["B","ㅠ"],["N","ㅜ"],["M","ㅡ"],[",","<"],[".",">"]]];
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'],JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const KS={'ㄱ':['r'],'ㄲ':['R'],'ㄴ':['s'],'ㄷ':['e'],'ㄸ':['E'],'ㄹ':['f'],'ㅁ':['a'],'ㅂ':['q'],'ㅃ':['Q'],'ㅅ':['t'],'ㅆ':['T'],'ㅇ':['d'],'ㅈ':['w'],'ㅉ':['W'],'ㅊ':['c'],'ㅋ':['z'],'ㅌ':['x'],'ㅍ':['v'],'ㅎ':['g'],'ㅏ':['k'],'ㅐ':['o'],'ㅑ':['i'],'ㅒ':['O'],'ㅓ':['j'],'ㅔ':['p'],'ㅕ':['u'],'ㅖ':['P'],'ㅗ':['h'],'ㅛ':['y'],'ㅜ':['n'],'ㅠ':['b'],'ㅡ':['m'],'ㅣ':['l'],'ㅘ':['h','k'],'ㅙ':['h','o'],'ㅚ':['h','l'],'ㅝ':['n','j'],'ㅞ':['n','p'],'ㅟ':['n','l'],'ㅢ':['m','l'],'ㄳ':['r','t'],'ㄵ':['s','w'],'ㄶ':['s','g'],'ㄺ':['f','r'],'ㄻ':['f','a'],'ㄼ':['f','q'],'ㄽ':['f','t'],'ㄾ':['f','x'],'ㄿ':['f','v'],'ㅀ':['f','g'],'ㅄ':['q','t'],' ':['space']};
function strokes(txt){let o=[];for(const ch of txt){let x=ch.codePointAt(0);if(x>=0xAC00&&x<=0xD7A3){let z=x-0xAC00,cho=CHO[Math.floor(z/588)],jung=JUNG[Math.floor((z%588)/28)],jong=JONG[z%28];o.push(...(KS[cho]||[]),...(KS[jung]||[]));if(jong)o.push(...(KS[jong]||[]))}else if(KS[ch])o.push(...KS[ch])}return o}
function buildKbd(){let el=$("keyboard");el.innerHTML="";ROWS.forEach((row,i)=>{let r=document.createElement("div");r.className="krow";if(i===2){let sh=document.createElement("div");sh.className="key shift";sh.dataset.key="SHIFT";sh.innerHTML='<span class="kor">Shift</span>';r.appendChild(sh)}row.forEach(([e,k])=>{let d=document.createElement("div");d.className="key"+((e==="F"||e==="J")?" home":"");d.dataset.key=e;d.innerHTML='<span class="eng">'+e+'</span><span class="kor">'+k+'</span>';r.appendChild(d)});el.appendChild(r)});let r=document.createElement("div");r.className="krow";let sp=document.createElement("div");sp.className="key space";sp.dataset.key="SPACE";sp.innerHTML='<span class="kor">SPACE</span>';r.appendChild(sp);el.appendChild(r)}
function guide(){document.querySelectorAll(".key").forEach(x=>x.classList.remove("nextkey"));if(!a||!c){$("guide").textContent="";return}let target=strokes(c[0]),typed=strokes($("answer").value),i=0;while(i<typed.length&&i<target.length&&typed[i]===target[i])i++;if(i<typed.length&&typed[i]!==target[i]){$("guide").textContent="入力を確認してください";return}if(i>=target.length){$("guide").textContent="";return}let k=target[i],id=k==="space"?"SPACE":k.toUpperCase();if(k.length===1&&k===k.toUpperCase()&&/[A-Z]/.test(k)){document.querySelector('[data-key="SHIFT"]')?.classList.add("nextkey")}document.querySelector('[data-key="'+CSS.escape(id)+'"]')?.classList.add("nextkey");$("guide").textContent="次に打つキー: "+((k.length===1&&k===k.toUpperCase()&&/[A-Z]/.test(k))?"Shift + ":"")+id}
buildKbd();
function csv(z){let r=[],q=false,row=[],v="";for(let i=0;i<z.length;i++){let x=z[i];if(x=='"')q=!q;else if(x==","&&!q){row.push(v);v=""}else if((x=="\n"||x=="\r")&&!q){if(v||row.length){row.push(v);r.push(row)}row=[];v=""}else v+=x}return r}
fetch(U).then(x=>x.text()).then(x=>{let z=csv(x).slice(1).filter(x=>x[0]&&x[1]&&Array.from(x[0].trim()).length<=6);if(z.length)w=z.map(x=>[x[0].trim(),x[1].trim()])}).catch(()=>{});
function say(){if(!c||!speechSynthesis)return;let u=new SpeechSynthesisUtterance(c[0]);u.lang="ko-KR";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function praise(){if(!speechSynthesis)return;let p=["좋아요!","잘했어요!","멋져요!","아주 좋아요!"][Math.floor(Math.random()*4)],u=new SpeechSynthesisUtterance(p);u.lang="ko-KR";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
function next(){if(n>=t)return end();n++;let pool=w.filter(x=>!last||x[0]!==last[0]);c=pool[Math.floor(Math.random()*pool.length)]||w[Math.floor(Math.random()*w.length)];last=c;$("kr").textContent=c[0];$("jp").textContent=c[1];$("count").textContent=" "+n+" / "+t;$("status").textContent="";$("answer").value="";$("answer").className="";$("answer").disabled=false;$("answer").focus();guide();say()}
function start(){w=w.filter(x=>Array.from(x[0].trim()).length<=6);a=true;n=0;s=0;last=null;t=Math.min(10,w.length);$("start").disabled=true;next()}
function react(){let q=$("coach"),b=$("bubble");q.classList.remove("react");void q.offsetWidth;q.classList.add("react");b.textContent=["PERFECT!","좋아!","멋져!"][Math.floor(Math.random()*3)];b.classList.add("show");setTimeout(()=>b.classList.remove("show"),600)}
function check(){if(!a||!c)return;let v=$("answer").value.trim();if(!v)return;if(v===c[0]){s++;$("answer").className="ok";$("status").textContent="正解！ 〇";react();praise();setTimeout(next,900)}else{$("answer").className="";$("status").textContent="";}}
function end(){a=false;$("kr").textContent="🎉 ゲーム終了！";$("jp").textContent="";$("status").textContent="正答数: "+s+" / "+t;$("count").textContent="";$("answer").disabled=true;$("answer").value="";guide();$("start").disabled=false;$("start").textContent="もう一度プレイ"}
$("start").onclick=start;$("skip").onclick=()=>a&&next();$("speak").onclick=say;$("answer").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};$("answer").oninput=()=>{guide();if(a&&c&&$("answer").value.trim()===c[0])check()};
</script></body></html>
