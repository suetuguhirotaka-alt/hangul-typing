<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハングル タイピング練習</title><style>body{font-family:-apple-system,sans-serif;background:#f5f6f8;margin:0;color:#111}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px #0001}button{font-size:16px;border:0;border-radius:11px;padding:11px 16px;margin:3px;background:#e9edf3}.primary{background:#0d47a1;color:#fff;font-weight:700}#kr{font-size:34px;font-weight:800;text-align:center;margin:24px 0 4px}#jp,#status{text-align:center;margin:8px}input{box-sizing:border-box;width:100%;font-size:28px;text-align:center;padding:14px;border:3px solid #ccd2da;border-radius:13px;margin:12px 0}.ok{background:#effaf0!important}.bad{background:#fff1f1!important}.hint{text-align:center;color:#666;font-size:14px}.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:stretch}.coach{position:relative;background:#15131b;border-radius:18px;overflow:hidden;min-height:360px}.coach img{width:100%;height:100%;object-fit:cover}.coach.react{animation:coachPop .42s ease}.bubble{position:absolute;left:10px;right:10px;bottom:12px;background:#111d;color:#fff;border:1px solid #d6b27a;border-radius:12px;padding:10px;text-align:center;font-weight:700;opacity:0;transform:translateY(8px);transition:.18s}.bubble.show{opacity:1;transform:none}@keyframes coachPop{50%{transform:scale(1.035);filter:brightness(1.25)}}@media(max-width:650px){.layout{grid-template-columns:1fr}.coach{min-height:210px}.coach img{height:210px;object-position:center 27%}}</style></head><body><main><h2>🇰🇷 ハングル タイピング練習</h2><div class="layout"><div class="coach" id="coach"><img src="character.svg" alt="オリジナル韓国語教師キャラクター"><div class="bubble" id="bubble">PERFECT!</div></div><div class="card"><button class="primary" id="start">スタート</button><button id="skip">スキップ</button><button id="speak">🔊 音声</button><span id="count"></span><div id="kr">「スタート」を押して開始</div><div id="jp"></div><div id="status"></div><input id="answer" lang="ko" autocomplete="off" placeholder="ここに韓国語を入力" disabled><div class="hint">iPadでは韓国語キーボードで入力してください。</div></div></div></main><script>
const U="https://docs.google.com/spreadsheets/d/e/2PACX-1vSDYYTuS1gyeWWXL2DhGnpenN6-MGjlYauitFx6Ia4K_sRSVeOxJoJOkc9R6SsHX9FXJSCvs2ax5tre/pub?output=csv",F=[["안녕하세요","こんにちは"],["감사합니다","ありがとうございます"],["한국어","韓国語"],["공부","勉強"],["친구","友達"],["사랑해요","愛しています"],["학교","学校"],["음악","音楽"],["커피","コーヒー"]];let w=F,c,n=0,s=0,t=10,a=false,$=x=>document.getElementById(x);
function csv(z){let r=[],q=false,row=[],v="";for(let i=0;i<z.length;i++){let x=z[i];if(x=='"')q=!q;else if(x==","&&!q){row.push(v);v=""}else if((x=="\n"||x=="\r")&&!q){if(v||row.length){row.push(v);r.push(row)}row=[];v=""}else v+=x}return r}
fetch(U).then(x=>x.text()).then(x=>{let z=csv(x).slice(1).filter(x=>x[0]&&x[1]);if(z.length)w=z.map(x=>[x[0].trim(),x[1].trim()])}).catch(()=>{});
function say(){if(!c||!speechSynthesis)return;let u=new SpeechSynthesisUtterance(c[0]);u.lang="ko-KR";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function next(){if(n>=t)return end();n++;c=w[Math.floor(Math.random()*w.length)];$("kr").textContent=c[0];$("jp").textContent=c[1];$("count").textContent=" "+n+" / "+t;$("status").textContent="";$("answer").value="";$("answer").className="";$("answer").disabled=false;$("answer").focus();say()}
function start(){a=true;n=0;s=0;t=Math.min(10,w.length);$("start").disabled=true;next()}
function react(){let q=$("coach"),b=$("bubble");q.classList.remove("react");void q.offsetWidth;q.classList.add("react");b.textContent=["PERFECT!","좋아!","멋져!"][Math.floor(Math.random()*3)];b.classList.add("show");setTimeout(()=>b.classList.remove("show"),600)}
function check(){if(!a||!c)return;let v=$("answer").value.trim();if(!v)return;if(v===c[0]){s++;$("answer").className="ok";$("status").textContent="正解！ 〇";react();setTimeout(next,650)}else{$("answer").className="";$("status").textContent="";}}
function end(){a=false;$("kr").textContent="🎉 ゲーム終了！";$("jp").textContent="";$("status").textContent="正答数: "+s+" / "+t;$("count").textContent="";$("answer").disabled=true;$("answer").value="";$("start").disabled=false;$("start").textContent="もう一度プレイ"}
$("start").onclick=start;$("skip").onclick=()=>a&&next();$("speak").onclick=say;$("answer").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};$("answer").oninput=()=>{if(a&&c&&$("answer").value.trim()===c[0])check()};
</script></body></html>
